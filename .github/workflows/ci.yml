name: Thwallet iOS CI

on:
  push:
    branches: [master, doge-evm-support]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_package_resolved:
        description: Re-resolve Swift packages and upload Package.resolved instead of testing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    if: ${{ github.repository == 'erebuskaimoros/Thwallet-iOS' }}
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode 26.4
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.4'

      - name: Create local build configuration
        run: cp Unstoppable/Unstoppable/Configuration/Config.template.xcconfig Unstoppable/Unstoppable/Configuration/Config.xcconfig

      - name: Refresh Package.resolved
        if: ${{ inputs.refresh_package_resolved }}
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -workspace Wallet.xcworkspace \
            -scheme Development

      - name: Upload refreshed Package.resolved
        if: ${{ inputs.refresh_package_resolved }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-resolved
          path: Wallet.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: error

      - name: Resolve packages
        if: ${{ !inputs.refresh_package_resolved }}
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -workspace Wallet.xcworkspace \
            -scheme Development \
            -disableAutomaticPackageResolution

      - name: Select simulator
        if: ${{ !inputs.refresh_package_resolved }}
        id: simulator
        run: |
          simulator_id=$(xcrun simctl list devices available --json | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices")
            iphone = devices.values.flatten.find { |device| device.fetch("name").start_with?("iPhone") }
            abort "No available iPhone simulator" unless iphone
            print iphone.fetch("udid")
          ')
          test -n "$simulator_id"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Build and test
        if: ${{ !inputs.refresh_package_resolved }}
        run: |
          # The raw xcodebuild transcript is too large for the job log to keep its tail, which is
          # where the diagnostics are. Keep it in a file and print only what explains a failure.
          xcodebuild_status=0
          xcodebuild \
            -workspace Wallet.xcworkspace \
            -scheme Development \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -enableCodeCoverage YES \
            -disableAutomaticPackageResolution \
            -resultBundlePath "$RUNNER_TEMP/Thwallet.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || xcodebuild_status=$?

          grep -E "(error|failed|issue)[: ]|Undefined symbol|^ld: |\*\* (BUILD|TEST) |Test run with|Executed [0-9]+ tests" \
            "$RUNNER_TEMP/xcodebuild.log" | sort -u | tail -n 400 || true
          echo "--- last lines"
          tail -n 60 "$RUNNER_TEMP/xcodebuild.log"
          test "$xcodebuild_status" -eq 0

          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/Thwallet.xcresult" \
            --compact |
            ruby -rjson -e '
              count = JSON.parse(STDIN.read).fetch("totalTestCount")
              abort "No tests executed" unless count.positive?
            '

      - name: Upload xcodebuild log
        if: ${{ always() && !inputs.refresh_package_resolved }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn
